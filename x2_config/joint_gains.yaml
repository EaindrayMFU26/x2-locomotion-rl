# damping_kd: DAMPING/ESTOP state damping. default = baseline for all joints;
# overrides = per-joint override (mirror mc DampingController special_joints).
# Values copied from mc official config:
#   /agibot/software/mc_param/robot/lx2501_3_t2d5/classic/damping.yaml (default_kd=5).
# shoulder_roll (L/R) and waist (yaw/pitch/roll) are not listed by mc -> inherit default 5.0.
damping_kd:
  default: 5.0
  overrides:
    left_hip_pitch_joint: 9.0
    right_hip_pitch_joint: 9.0
    left_hip_roll_joint: 8.0
    right_hip_roll_joint: 8.0
    left_hip_yaw_joint: 8.0
    right_hip_yaw_joint: 8.0
    left_knee_joint: 8.0
    right_knee_joint: 8.0
    left_ankle_pitch_joint: 7.5
    right_ankle_pitch_joint: 7.5
    left_ankle_roll_joint: 3.0
    right_ankle_roll_joint: 3.0
    left_shoulder_pitch_joint: 4.0
    right_shoulder_pitch_joint: 4.0
    left_shoulder_yaw_joint: 3.0
    right_shoulder_yaw_joint: 3.0
    left_elbow_joint: 3.0
    right_elbow_joint: 3.0
    left_wrist_yaw_joint: 3.0
    right_wrist_yaw_joint: 3.0
    left_wrist_pitch_joint: 1.0
    right_wrist_pitch_joint: 1.0
    left_wrist_roll_joint: 1.0
    right_wrist_roll_joint: 1.0
    head_yaw_joint: 0.01
    head_pitch_joint: 0.5
